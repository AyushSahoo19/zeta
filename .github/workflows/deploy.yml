name: Validate and deploy ZETA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate app and catalogue
        run: node scripts/check.mjs
      - name: Prepare release files
        run: |
          mkdir site
          cp index.html styles.css app.js data.js domain-content.js learning-paths.js course-catalog.js courses.js .nojekyll site/
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload release
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
